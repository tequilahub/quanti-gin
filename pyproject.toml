[tool.poetry]
name = "quanti-gin"
version = "3.0.1"
description = "A customizable data generator for quantum simulation"
authors = ["Korbinian Stein <kstein@inforbi.de>"]
license = "MIT"
readme = "README.md"
repository = "https://github.com/nylser/quanti-gin"
packages = [{include = "quanti_gin"}]

[tool.poetry.dependencies]
python = ">=3.10"
tequila-basic = "^1.9.8"
pandas = "^2.2.2"
numpy = "*"

# sunrise's graph_selection is not on PyPI yet; PyPI rejects git dependencies,
# so it lives in its own group until project-sunrise is released with it
[tool.poetry.group.sunrise.dependencies]
project-sunrise = {git = "https://github.com/tequilahub/sunrise.git", branch = "devel"}

[tool.poetry.group.dev.dependencies]
black = "^24.4.2"
pre-commit = "^3.7.1"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
