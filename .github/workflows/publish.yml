on:
  release:
    types: [published]

permissions:
  contents: read

name: publish

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/quanti-gin
    steps:
      - uses: actions/checkout@v4

      # the release tag (e.g. v3.0.1) must match the version in pyproject.toml
      - name: Check release tag matches package version
        run: |
          version=$(grep -m1 '^version' pyproject.toml | cut -d'"' -f2)
          test "${GITHUB_REF_NAME#v}" = "$version" || { echo "::error::tag $GITHUB_REF_NAME does not match pyproject.toml version $version"; exit 1; }

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Build and inspect python package
        uses: hynek/build-and-inspect-python-package@v2

      - name: Download packages built by build-and-inspect-python-package
        uses: actions/download-artifact@v4
        with:
          name: Packages
          path: dist

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # PyPI API token (pypi-...) of a quanti-gin maintainer
          password: ${{ secrets.PYPI_QUANTI_GIN }}
